services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: party
      POSTGRES_PASSWORD: party_secret
      POSTGRES_DB: party_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party -d party_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://party:party_secret@db:5432/party_db
      DIRECT_URL: postgresql://party:party_secret@db:5432/party_db
      PORT: "3000"
      NODE_ENV: development
      JWT_SECRET: dev-secret
    volumes:
      - ./src:/app/src
      - ./server/src:/app/server/src
      - ./server/prisma:/app/server/prisma
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
